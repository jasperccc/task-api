[project]
name = "task-api"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2,<3",
    "sqlalchemy[asyncio]>=2,<3",
    "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
